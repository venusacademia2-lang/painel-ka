<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Angola — a redireccionar…</title>
<meta name="robots" content="noindex">
<script>
/* landing-v2.html foi consolidada em landing.html (ficheiro único, sem diferenças de conteúdo).
   Este ficheiro fica apenas como redireccionamento para não partir links antigos já partilhados
   (WhatsApp, TikTok, catálogo-v2, etc.). Preserva query string e âncora, e garante que a fonte
   de tráfego (utm/referrer) não se perde na passagem. */
(function(){
  try{
    var qs=new URLSearchParams(location.search);
    var jaTemFonte = qs.get("utm_source")||qs.get("fonte")||qs.get("src");
    if(!jaTemFonte){
      var ref=(document.referrer||"").toLowerCase();
      var f="";
      if(ref.indexOf("tiktok")>=0)f="TikTok";
      else if(ref.indexOf("instagram")>=0)f="Instagram";
      else if(ref.indexOf("linkedin")>=0)f="LinkedIn";
      else if(ref.indexOf("facebook")>=0||ref.indexOf("fb.com")>=0)f="Facebook";
      else if(ref.indexOf("google")>=0)f="Google";
      else if(ref.indexOf("whatsapp")>=0)f="WhatsApp";
      if(f)qs.set("src",f);
    }
    var qsStr=qs.toString();
    var destino="landing.html"+(qsStr?("?"+qsStr):"")+location.hash;
    location.replace(destino);
  }catch(e){ location.href="landing.html"; }
})();
</script>
<meta http-equiv="refresh" content="0; url=landing.html">
</head>
<body>
<p style="font-family:system-ui,sans-serif;padding:24px;color:#333">
A redireccionar para a <a href="landing.html">ficha de inscrição</a>…
</p>
</body>
</html>
