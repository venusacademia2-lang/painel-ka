<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Gestão — Knowledge Angola</title>
<style>
:root{color-scheme:light;--azul:#1F3864;--azul2:#2E5496;--dour:#BF9000;--bg:#f5f5f7;--cinza:#EEF1F6;--linha:#E2E6EE;--verde:#1E7B45;--verm:#C0392B;--txt:#1a2233;--sombra:0 1px 2px rgba(0,0,0,.04),0 6px 22px rgba(0,0,0,.05)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 15px;font-weight:600;font-size:14px}
.btn-p{background:var(--azul);color:#fff}.btn-p:hover{background:var(--azul2)}
.btn-g{background:var(--dour);color:#fff}
.btn-o{background:#fff;color:var(--azul);border:1px solid var(--linha)}.btn-o:hover{border-color:var(--azul2)}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--linha);border-radius:9px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul2)}
label{display:block;font-weight:600;font-size:12px;margin:0 0 4px;color:#55607a}
.muted{color:#7b869c;font-size:12.5px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:linear-gradient(160deg,#0d1730,#152549 55%,#0d1730)}
#login .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0;animation:kaFloat 16s ease-in-out infinite}
@keyframes kaFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(26px,-22px) scale(1.08)}66%{transform:translate(-20px,18px) scale(.95)}}
.card{background:#fff;border:1px solid var(--linha);border-radius:16px;box-shadow:var(--sombra)}
.loginbox{width:100%;max-width:430px;padding:38px 34px;position:relative;z-index:2;border-radius:26px;box-shadow:0 30px 80px rgba(6,12,30,.55);border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.98);backdrop-filter:blur(18px);animation:kaCardIn .6s cubic-bezier(.22,1,.36,1)}
@keyframes kaCardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.wordmark-lg{height:52px;display:block;margin:0 auto}
.lg-field{position:relative;margin-top:8px}
.lg-field .lg-ic{position:absolute;left:14px;bottom:11px;color:#9aa6bf;pointer-events:none}
.lg-field input{padding-left:40px!important;border-radius:14px!important;background:#f6f8fc!important;border:1.5px solid #e6eaf3!important;transition:border-color .15s,box-shadow .15s,background .15s}
.lg-field input:focus{background:#fff!important;border-color:var(--dour)!important;box-shadow:0 0 0 4px rgba(191,144,0,.14)}
.lg-field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8994ab}
.btn-google{width:100%;justify-content:center;display:flex;gap:10px;align-items:center;background:#fff!important;color:#3c4043!important;border:1.5px solid #e4e7ec;border-radius:14px;padding:12px 15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s,transform .15s}
.btn-google:hover{box-shadow:0 6px 18px rgba(20,30,60,.16);transform:translateY(-1px)}
.btn-entrar-lg{width:100%;justify-content:center;border-radius:14px;padding:12px 15px;background:linear-gradient(135deg,var(--azul),#274a86);transition:transform .15s,box-shadow .15s;box-shadow:0 8px 22px rgba(31,56,100,.28)}
.btn-entrar-lg:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(31,56,100,.36);background:linear-gradient(135deg,var(--azul),#274a86)}
.lg-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#a7b0c2;font-size:11.5px}
.lg-divider::before,.lg-divider::after{content:"";flex:1;height:1px;background:#e7eaf1}
.entrymode{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.entrymode button{width:100%;padding:15px;text-align:left;display:flex;flex-direction:column;gap:2px}
.entrymode .sub{font-weight:400;font-size:12px;opacity:.85}
.note{background:#fbf1d9;border:1px solid #ead98c;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#6b5200;margin-top:14px}
/* shell */
#app{display:flex;min-height:100vh}
#sidebar{width:236px;background:#fff;border-right:1px solid var(--linha);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-logo{padding:20px 18px 14px;border-bottom:1px solid var(--linha)}
.side-logo img{height:36px;display:block}
#nav{flex:1;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.navbtn{background:none;color:#55607a;text-align:left;border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:11px;border-left:3px solid transparent;font-weight:600}
.navbtn:hover{background:var(--cinza)}
.navbtn.active{background:#eaf0fb;color:var(--azul);border-left-color:var(--dour)}
.navbtn .ic{width:18px;height:18px;flex:0 0 18px;color:inherit}
.side-foot{padding:14px;border-top:1px solid var(--linha);display:flex;flex-direction:column;gap:9px}
.rolechip{background:var(--azul);color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;text-align:center}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--linha);padding:16px 26px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mob-sair{display:none}
.topbar h1{font-size:21px;color:var(--azul);font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.01em}
.topbar::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:38%;max-width:360px;background:linear-gradient(90deg,var(--dour),transparent)}
.topbar .sub{margin-top:2px}
main{padding:24px 26px;max-width:1320px;width:100%}
/* kpis + cards */
.kpigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:18px 16px 16px;box-shadow:var(--sombra);cursor:pointer;transition:border-color .15s,transform .15s;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;height:3px;width:100%;background:var(--azul);opacity:.85}
.kpi:hover{border-color:var(--azul2);transform:translateY(-1px)}
.kpi .lab{font-size:12px;color:#7b869c;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;color:var(--azul);margin-top:6px}
.kpi.alert .val{color:var(--verm)}.kpi.money .val{color:var(--verde)}
.sec{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:18px;margin-top:18px;box-shadow:var(--sombra);overflow-x:auto}
.sec h2{font-size:17px;color:var(--azul);margin-bottom:2px;font-family:Georgia,'Times New Roman',serif;font-weight:700;display:inline-block;border-bottom:2px solid var(--dour);padding-bottom:3px}
.sec .muted{margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linha)}
th{color:#7b869c;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
tr:hover td{background:#fafbfe}
.pill{padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;display:inline-block}
.p-verde{background:#e5f4ec;color:var(--verde)}.p-verm{background:#fbe7e6;color:var(--verm)}
.p-azul{background:#e7edf7;color:var(--azul2)}.p-dour{background:#fbf1d9;color:#8a6a00}.p-cinza{background:#eef0f4;color:#66708a}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.search{max-width:360px;margin-bottom:12px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.col{background:var(--bg);border-radius:12px;padding:12px;min-height:120px;overflow:hidden}
.tablewrap{overflow-x:auto}
.col h3{font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between}
.leadcard{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px;margin-bottom:9px;font-size:12.5px}
.leadcard b{display:block}.leadcard .mv{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.leadcard .mv button{padding:3px 8px;font-size:11px}
.chartwrap{height:220px;position:relative}
/* tarefas */
.todo{display:flex;align-items:flex-start;gap:11px;padding:11px 6px;border-bottom:1px solid var(--linha)}
.todo:last-child{border-bottom:none}
.todo input[type=checkbox]{width:20px;height:20px;margin-top:1px;cursor:pointer;accent-color:var(--azul)}
.todo .t{flex:1;line-height:1.4}
.todo.done .t{text-decoration:line-through;color:#9aa3b5}
.todo .x{background:none;color:#b7bfce;padding:2px 8px}.todo .x:hover{color:var(--verm)}
.addbar{display:flex;gap:9px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--azul);color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;opacity:0;transition:.3s;z-index:50}
.toast.show{opacity:1}
#navmask{display:none;position:fixed;inset:0;background:rgba(20,30,60,.4);z-index:55}
.mob-menu{display:none;background:none;color:var(--azul);font-size:22px;padding:2px 10px;cursor:pointer;line-height:1;border-radius:8px}
.mob-menu:hover{background:var(--cinza)}
.top-k{display:none;flex:0 0 auto}
.mobrole{display:none}
@media(max-width:820px){
 #sidebar{position:fixed;top:0;left:0;height:100vh;width:250px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 6px 30px rgba(20,30,60,.25)}
 #app.navopen #sidebar{transform:translateX(0)}
 #app.navopen #navmask{display:block}
 .mob-menu{display:inline-flex;align-items:center}
 .top-k{display:block}
 .mob-sair{display:inline-block}
 .side-foot{display:none}
 .sec{overflow-x:auto}
 .sec table{min-width:100%;width:max-content}
 main{padding:14px}
 .topbar{padding:12px 14px}
 .topbar h1{font-size:17px}
 .sec table td:first-child,.sec table th:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--linha)}
 html[data-theme="dark"] .sec table td:first-child,html[data-theme="dark"] .sec table th:first-child{background:#1a2130}
}
@media(max-width:560px){
 body{font-size:13.5px}
 main{padding:10px}
 .sec{padding:13px;margin-top:12px;border-radius:11px}
 .formgrid{grid-template-columns:1fr}
 .kpigrid{grid-template-columns:1fr}
 .kanban{grid-template-columns:1fr}
 .search{max-width:100%}
 .topbar{padding:10px 12px}
 .topbar h1{font-size:16px}
 .sec h2{font-size:16px}
 .row-actions{flex-wrap:wrap}
 .formgrid input,.formgrid select,.formgrid textarea{font-size:16px}
 .navbtn{font-size:15.5px;padding:12px 12px}
 .navtop{font-size:15.5px}
 .navgrp>summary{font-size:13px;padding:12px 14px;letter-spacing:.03em}
 #sidebar{width:270px}
 .topbar{flex-wrap:wrap;row-gap:6px}
 #ocultBtn span{display:none}
 .topbar h1{flex:1 0 55%}
}
@page{size:A4;margin:0}
@media print{html,body{background:#fff!important}body *{visibility:hidden}#compdoc,#compdoc *,#recdoc,#recdoc *{visibility:visible}#compdoc,#recdoc{position:absolute!important;left:0;top:0;width:100%;background:#fff!important;border:none!important;border-radius:0!important;margin:0!important;padding:8mm 13mm!important;font-size:11.5px!important;line-height:1.35!important;box-shadow:none!important}
#compdoc .det{margin-top:8px!important;padding-top:7px!important}
#compdoc h2{margin:8px 0 3px!important;font-size:14px!important}
#compdoc p{margin:3px 0!important}
#compdoc img{max-height:58px!important}
#compdoc{page-break-inside:avoid!important}
html.pv body *{visibility:hidden}
html.pv #views,html.pv #views *{visibility:visible}
html.pv #views{position:absolute!important;left:0;top:0;width:100%;padding:8mm!important}
html.pv .noprint,html.pv #sidebar,html.pv .topbar,html.pv button,html.pv .row-actions{display:none!important}
html.pv table{font-size:10.5px!important;width:100%!important}#compdoc h2{margin:16px 0 6px!important}#compdoc p{margin:9px 0!important}#compdoc .det{margin-top:18px!important;padding-top:14px!important}}
details.sec>summary{cursor:pointer;font-weight:700;color:var(--azul);font-size:16px;list-style:none;padding:2px 0;outline:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸ ";color:var(--dour)}
details.sec[open]>summary::before{content:"▾ "}
details.subdet{margin-top:6px}
details.subdet>summary{cursor:pointer;font-weight:600;color:var(--azul2);font-size:13px;list-style:none;outline:none}
details.subdet>summary::-webkit-details-marker{display:none}
details.subdet>summary::before{content:"+ ";color:var(--dour);font-weight:800}
details.subdet[open]>summary::before{content:"– "}
.navtop{font-weight:600;border-bottom:1px solid var(--linha)}
.sec,.kpi{border-radius:16px}
.btn-p,.btn-g,.btn-o{border-radius:10px;transition:transform .12s,filter .12s,background .15s}
.btn-p:hover,.btn-g:hover{filter:brightness(1.05);transform:translateY(-1px)}
.kpi{transition:transform .15s,box-shadow .15s}
input,select,textarea{border-radius:10px}
html[data-theme="dark"]{--bg:#0f1420;--cinza:#1a2130;--linha:#2a3345;--txt:#e6ebf3;--sombra:none}
html[data-theme="dark"] .sec,html[data-theme="dark"] .kpi,html[data-theme="dark"] .leadcard{box-shadow:none}
html[data-theme="dark"] .card{background:#1e2838;border:1px solid #37455f;box-shadow:none}
html[data-theme="dark"] tr:hover td{background:#232d3f}
html[data-theme="dark"] body{background:#0f1420;color:#e6ebf3}
html[data-theme="dark"] .sec,html[data-theme="dark"] .kpi,html[data-theme="dark"] .topbar,html[data-theme="dark"] #sidebar,html[data-theme="dark"] .leadcard,html[data-theme="dark"] .card,html[data-theme="dark"] .formcard,html[data-theme="dark"] details.sec{background:#1a2130;border-color:#2a3345;color:#e6ebf3}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:#0f1420;color:#e6ebf3;border-color:#2a3345}
html[data-theme="dark"] .navbtn{color:#aab6cf}html[data-theme="dark"] table th{color:#9aa6bd}html[data-theme="dark"] .muted{color:#8b97ab}
html[data-theme="dark"] h1,html[data-theme="dark"] h2,html[data-theme="dark"] h3{color:#e6ebf3}
html[data-theme="dark"] .val{color:#eaf0fb}
html[data-theme="dark"] .lab{color:#9aa6bd}
html[data-theme="dark"] .btn-o{background:#1a2130;color:#dbe3f0;border-color:#33405a}
html[data-theme="dark"] label{color:#aab6cf}
html[data-theme="dark"] details.sec>summary{color:#cdd8ec}
html[data-theme="dark"] details.subdet>summary{color:#aab6cf}
html[data-theme="dark"] .p-cinza{background:#2a3345;color:#c9d2e3}
html[data-theme="dark"] a{color:#8fb3f0}
html[data-theme="dark"] b,html[data-theme="dark"] strong{color:#f2f5fa}
html[data-theme="dark"] .navgrp>summary{color:#8b97ab}
html[data-theme="dark"] .topbar h1,html[data-theme="dark"] .rolechip{color:#e6ebf3}
.tema-toggle{border:none;background:none;cursor:pointer;padding:0;margin-right:10px}
.tema-track{display:inline-flex;align-items:center;width:52px;height:28px;border-radius:20px;background:var(--cinza);border:1px solid var(--linha);position:relative;transition:background .2s;vertical-align:middle}
.tema-thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s;display:grid;place-items:center}
.tema-thumb::after{content:"\2600";font-size:13px;color:#f5a623;line-height:1}
html[data-theme="dark"] .tema-track{background:#2a3345}
html[data-theme="dark"] .tema-thumb{left:28px;background:#0f1420}
html[data-theme="dark"] .tema-thumb::after{content:"\263E";color:#c9d2e3}
.navgrp{border-bottom:1px solid var(--linha)}
.navgrp>summary{cursor:pointer;list-style:none;padding:10px 14px;font-weight:700;color:#55607a;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.navgrp>summary::-webkit-details-marker{display:none}
.navgrp>summary::before{content:"\25B8";color:var(--azul2);margin-right:6px;font-size:10px}
.navgrp[open]>summary::before{content:"\25BE"}
.navgrp .navbtn{padding-left:26px}
@media (max-width:720px){
 .formgrid{grid-template-columns:1fr!important}
 .kpigrid{grid-template-columns:1fr 1fr!important}
 .kanban{grid-template-columns:1fr!important}
 table{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .btn-p,.btn-g,.btn-o{min-height:40px;padding-top:8px;padding-bottom:8px}
 .pill{min-height:26px;display:inline-flex;align-items:center}
 input,select,textarea{font-size:16px}
 .card{max-height:90vh;overflow:auto}
 .topbar h1{font-size:18px}
 .row-actions{flex-wrap:wrap;gap:8px}
}
.row-actions{flex-wrap:wrap}
td .flex{flex-wrap:wrap;gap:5px}
.leadcard .mv{flex-wrap:wrap}
/* L24: modais (overlay fixed + place-items:center, padrão usado em todo o painel) ficam redimensionáveis —
   arrasta o canto inferior direito do modal para aumentar o tamanho. */
div[style*="position:fixed"][style*="place-items:center"]>.card{resize:both;overflow:auto;min-width:320px;min-height:160px}
</style>
</head>
<body>
<!--ka-->
<style>@keyframes kaPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}@keyframes kaRing{0%{transform:scale(.75);opacity:.55}100%{transform:scale(1.55);opacity:0}}@keyframes kaBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}</style>
<div id="booting" style="position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#20305a,#0e1730);z-index:200">
  <div style="position:relative;display:grid;place-items:center">
    <div style="position:absolute;width:120px;height:120px;border:2px solid #BF9000;border-radius:50%;animation:kaRing 1.7s ease-out infinite"></div>
    <div style="position:absolute;width:120px;height:120px;border:2px solid #3a4d75;border-radius:50%;animation:kaRing 1.7s ease-out .85s infinite"></div>
    <svg width="84" height="84" viewBox="0 0 100 100" style="animation:kaPulse 1.7s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(191,144,0,.55))"><circle cx="50" cy="50" r="46" fill="#1F3864" stroke="#BF9000" stroke-width="1.5"/><circle cx="50" cy="20" r="4" fill="#BF9000"/><text x="50" y="53" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif" font-size="48" font-weight="700" fill="#fff">K</text></svg>
    <div style="position:absolute;bottom:-42px;display:flex;gap:5px;align-items:flex-end;height:20px">
      <span style="width:5px;height:20px;background:#BF9000;border-radius:2px;transform-origin:bottom;animation:kaBar 1s ease-in-out infinite"></span>
      <span style="width:5px;height:20px;background:#F3C34E;border-radius:2px;transform-origin:bottom;animation:kaBar 1s ease-in-out .18s infinite"></span>
      <span style="width:5px;height:20px;background:#fff;border-radius:2px;transform-origin:bottom;animation:kaBar 1s ease-in-out .36s infinite"></span>
      <span style="width:5px;height:20px;background:#BF9000;border-radius:2px;transform-origin:bottom;animation:kaBar 1s ease-in-out .54s infinite"></span>
    </div>
  </div>
</div>
<div id="login">
  <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden">
    <div class="blob" style="top:-8%;left:-6%;width:420px;height:420px;background:#BF9000"></div>
    <div class="blob" style="bottom:-12%;right:-8%;width:480px;height:480px;background:#2E5496;animation-delay:2.5s"></div>
    <div class="blob" style="top:38%;right:10%;width:260px;height:260px;background:#7c4fd6;opacity:.32;animation-delay:5s"></div>
    <div style="position:absolute;top:10%;left:12%;width:240px;height:240px;border:2px solid rgba(191,144,0,.16);border-radius:50%;animation:kaRing 4.5s ease-out infinite"></div>
    <div style="position:absolute;bottom:8%;right:10%;width:320px;height:320px;border:2px solid rgba(90,120,180,.22);border-radius:50%;animation:kaRing 6s ease-out 1.2s infinite"></div>
    <div style="position:absolute;top:26%;right:22%;width:9px;height:9px;background:#BF9000;border-radius:50%;opacity:.55;animation:kaPulse 3s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:24%;left:20%;width:7px;height:7px;background:#F3C34E;border-radius:50%;opacity:.45;animation:kaPulse 3.6s ease-in-out .6s infinite"></div>

const CURSOS_BASE=["Excel do Básico ao Avançado","Excel do Zero ao Fundamental","Power BI"];
/* L32 — nomes antigos de curso (antes do rebranding da landing) → nomes novos, para migração automática. */
const CURSO_RENOME={"Excel (do básico ao avançado)":"Excel do Básico ao Avançado"};
function migrarNomesCursos(){var ren=CURSO_RENOME;
 (data.turmas||[]).forEach(function(t){if(t.curso&&ren[t.curso])t.curso=ren[t.curso];});
 (data.formandos||[]).forEach(function(f){if(f.curso&&ren[f.curso])f.curso=ren[f.curso];});
 (data.leads||[]).forEach(function(l){if(l.curso&&ren[l.curso])l.curso=ren[l.curso];});
 (data.certificados||[]).forEach(function(c){if(c.curso&&ren[c.curso])c.curso=ren[c.curso];});
 (data.online||[]).forEach(function(o){if(o.curso&&ren[o.curso])o.curso=ren[o.curso];});
 if(data.precos&&typeof data.precos==="object"){Object.keys(ren).forEach(function(old){if(data.precos[old]!==undefined){var nv=ren[old];if(data.precos[nv]===undefined)data.precos[nv]=data.precos[old];delete data.precos[old];}});}
 if(Array.isArray(data.cursosOcultos)){data.cursosOcultos=data.cursosOcultos.map(function(c){return ren[c]||c;});}
 if(data.feedbackPerguntasCurso&&typeof data.feedbackPerguntasCurso==="object"){Object.keys(ren).forEach(function(old){if(data.feedbackPerguntasCurso[old]!==undefined){var nv=ren[old];if(data.feedbackPerguntasCurso[nv]===undefined)data.feedbackPerguntasCurso[nv]=data.feedbackPerguntasCurso[old];delete data.feedbackPerguntasCurso[old];}});}
 [data.trafego,].concat(Object.keys(data.trafegoPorMes||{}).map(function(m){return data.trafegoPorMes[m];})).forEach(function(T){if(!T)return;Object.keys(T).forEach(function(fonte){var areas=T[fonte];if(!areas)return;Object.keys(ren).forEach(function(old){if(areas[old]!==undefined){var nv=ren[old];areas[nv]=(+areas[nv]||0)+(+areas[old]||0);delete areas[old];}});});});
 if(!data.precos)data.precos={};
 if(data.precos["Excel do Zero ao Fundamental"]===undefined)data.precos["Excel do Zero ao Fundamental"]=24500;
}
function cursosLista(){var oc=(data&&data.cursosOcultos)||[];var base=CURSOS_BASE.slice();Object.keys((data&&data.precos)||{}).forEach(function(c){if(base.indexOf(c)<0)base.push(c);});return base.filter(function(c){return oc.indexOf(c)<0;});}
function podeCursos(){return role==="admin"||(currentUser&&currentUser.gereCursos===true);}
function podeEmailMkt(){return role==="admin"||(currentUser&&currentUser.gereEmailMkt===true);}
function emailMktLista(){
 var rows=[];
 (data.formandos||[]).forEach(function(f){if(!f.email)return;var t=turmaByCod(f.turma);rows.push({nome:f.nome||"",email:f.email,tel:f.tel||"",turma:(t&&t.curso)||f.curso||"",data:(f.data||f.criadoEm||"").slice(0,10)});});
 (data.online||[]).forEach(function(o){if(!o.email)return;rows.push({nome:o.nome||"",email:o.email,tel:o.contacto||o.tel||"",turma:"Excel — Online",data:(o.inicio||o.criadoEm||"").slice(0,10)});});
 rows.sort(function(a,b){return (b.data||"").localeCompare(a.data||"");});
 var seen={},out=[];
 rows.forEach(function(r){var k=r.email.trim().toLowerCase();if(!k||seen[k])return;seen[k]=true;out.push(r);});
 out.sort(function(a,b){return (a.nome||"").localeCompare(b.nome||"","pt");});
 return out;
}
function vEmailMkt(){
 if(!podeEmailMkt())return `<div class="sec"><div class="muted">Sem permissão para ver a Base de E-mails. Pede à gestão para te autorizar em Carga da equipa → Permissões.</div></div>`;
 var l=emailMktLista();
 return `<div class="sec"><div class="flex"><div><h2>Base de E-mails</h2><div class="muted">${l.length} formando(s) com e-mail registado — Presenciais e Online, sem duplicados (um e-mail por pessoa, o registo mais recente). Pronta para usar numa ferramenta de e-mail marketing.</div></div><div class="spacer"></div><button class="btn-o" onclick="exportarVista('csv')">⬇ Exportar CSV</button></div>
  <table><thead><tr><th>Nome</th><th>E-mail</th><th>Contacto</th><th>Turma</th><th>Data</th></tr></thead><tbody>
  ${l.map(function(r){return '<tr><td>'+esc(r.nome)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.tel)+'</td><td>'+esc(r.turma)+'</td><td>'+esc(r.data)+'</td></tr>';}).join("")||'<tr><td colspan="5" class="muted">Sem e-mails registados ainda.</td></tr>'}
  </tbody></table></div>`;
}
function cursosLog(acao,curso,motivo){if(!Array.isArray(data.cursosLog))data.cursosLog=[];data.cursosLog.unshift({quando:new Date().toISOString(),quem:(currentUser&&currentUser.nome)||role,acao:acao,curso:curso||"",motivo:motivo||""});if(data.cursosLog.length>60)data.cursosLog.length=60;}
function addCurso(){if(!podeCursos()){toast("Só a gestão ou quem ela autorizar");return;}var n=(val("nc_nome")||"").trim();var p=+val("nc_preco")||0;if(!n){toast("Escreve o nome do curso");return;}if(!data.precos)data.precos={};if(data.precos[n]!=null){toast("Esse curso já existe");return;}data.precos[n]=p;if(Array.isArray(data.cursosOcultos)){var i=data.cursosOcultos.indexOf(n);if(i>=0)data.cursosOcultos.splice(i,1);}cursosLog("Criado",n,"");persist();toast("Curso criado — já aparece em todo o sistema");render();}
function ocultarCurso(c){if(!podeCursos()){toast("Só a gestão ou quem ela autorizar");return;}var m=prompt("Motivo para ocultar \""+c+"\" (fica registado):");if(m===null)return;if(!(m||"").trim()){toast("O motivo é obrigatório");return;}if(!Array.isArray(data.cursosOcultos))data.cursosOcultos=[];if(data.cursosOcultos.indexOf(c)<0)data.cursosOcultos.push(c);cursosLog("Ocultado",c,m.trim());persist();toast("Curso ocultado");render();}

function emailDoColaborador(nome){if(!nome)return"";var p=(data.perfis||[]).find(function(x){return x.nome===nome;});return (p&&p.email)?p.email:"";}

function juntarConvidados(){var vistos={};var out=[];for(var i=0;i<arguments.length;i++){var e=(arguments[i]||"").trim();if(e&&!vistos[e]){vistos[e]=true;out.push(e);}}return out.join(",");}

/* L27-1: reformatar o valor a cada tecla empurrava sempre o cursor para o fim, fazendo parecer
   que "apagar por trás" não funcionava (o separador de milhar comia o backspace). Recalcula a
   posição do cursor a partir de quantos dígitos existem antes dele, para poder apagar em
   qualquer posição — tal como num teclado numérico de telemóvel. */
function maskMil(el){
 const antes=el.value||"";const pos=el.selectionStart==null?antes.length:el.selectionStart;
 const digitosAntes=antes.slice(0,pos).replace(/\D/g,"").length;
 const d=antes.replace(/\D/g,"");const novo=fmtMil(d);el.value=novo;
 let restantes=digitosAntes,novaPos=novo.length;
 for(let i=0;i<novo.length;i++){if(/\d/.test(novo[i])){restantes--;if(restantes<=0){novaPos=i+1;break;}}}
 if(digitosAntes<=0)novaPos=0;
 try{el.setSelectionRange(novaPos,novaPos);}catch(e){}
}

/* L27-4: quando é que as pessoas mais preenchem (quiz, catálogo, landing, leads manuais) —
   usa criadoEm (hora exacta) de todos os leads que já a tenham gravada; leads antigos sem
   essa informação ficam de fora da contagem, sem partir nada. */
function resumoPicoLeads(){
 const DIAS_LONGO=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
 const porHora={},porDia={};let n=0;
 (data.leads||[]).forEach(function(l){if(!l.criadoEm)return;const d=new Date(l.criadoEm);if(isNaN(d.getTime()))return;n++;
  const h=d.getHours();porHora[h]=(porHora[h]||0)+1;const w=d.getDay();porDia[w]=(porDia[w]||0)+1;});
 if(n<5)return null;
 const horasOrd=Object.keys(porHora).map(Number).sort(function(a,b){return porHora[b]-porHora[a];});
 const diasOrd=Object.keys(porDia).map(Number).sort(function(a,b){return porDia[b]-porDia[a];});
 const topHoras=horasOrd.slice(0,2).map(function(h){return String(h).padStart(2,"0")+"h-"+String((h+1)%24).padStart(2,"0")+"h";}).join(" e ");
 const topDias=diasOrd.slice(0,2).map(function(w){return DIAS_LONGO[w];}).join(" e ");
 return{n:n,topHoras:topHoras,topDias:topDias};
}
function resumoPicoLeadsHTML(){const r=resumoPicoLeads();if(!r)return"";
 return '<div class="note" style="background:#eaf0fb;border-color:#c7d6f0;color:#1F3864"><b>📈 Quando as pessoas mais preenchem:</b> maioria às <b>'+esc(r.topDias)+'</b>, entre <b>'+esc(r.topHoras)+'</b> · com base em '+r.n+' registo(s) com hora conhecida (quiz, catálogo, landing e leads manuais).</div>';
}

 ${podeIndicacao()?`<details class="sec accdet"><summary>Programa de indicação</summary><div class="muted">Regista quem um formando indicou. Assim que o indicado se inscrever, converte-o em lead/formando normalmente.</div><div class="formgrid"><div><label>Quem indicou</label><input id="ind_por" placeholder="Nome do formando/ex-formando"></div><div><label>Nome do indicado</label><input id="ind_nome" placeholder="Nome de quem foi indicado"></div><div><label>Telefone</label><input id="ind_tel" placeholder="9XX XXX XXX"></div><div><label>Curso de interesse</label><input id="ind_curso" placeholder="opcional"></div></div><div class="row-actions"><button class="btn-p" onclick="addIndicacao()">Registar indicação</button></div><table><thead><tr><th>Indicado por</th><th>Indicado</th><th>Telefone</th><th>Estado</th><th>Responsável</th><th></th></tr></thead><tbody>${indicacoes().map((x,i)=>`<tr><td>${esc(x.indicadoPor)}</td><td>${esc(x.nome)}</td><td>${esc(x.tel||"")}</td><td><select onchange="setIndicacaoEstado(${i},this.value)"><option ${x.estado==="Novo"?"selected":""}>Novo</option><option ${x.estado==="Contactado"?"selected":""}>Contactado</option><option ${x.estado==="Inscrito"?"selected":""}>Inscrito</option><option ${x.estado==="Perdido"?"selected":""}>Perdido</option></select></td><td>${esc(x.resp||"—")}</td><td>${role==="admin"?`<button class="btn-o" style="padding:3px 8px" onclick="delIndicacao(${i})">✕</button>`:""}</td></tr>`).join("")||'<tr><td colspan="6" class="muted">Sem indicações registadas ainda.</td></tr>'}</tbody></table></details>`:""}
 <div class="sec"><h2>Quadro de leads</h2><div class="muted">Move cada lead pelo funil: Novo → Contactado → Inscrito.</div><div style="margin:8px 0" class="flex" style="gap:8px;flex-wrap:wrap"><input id="leadsearch" value="${esc(leadQ)}" placeholder="🔍 Pesquisar lead por nome, telefone, curso ou responsável…" oninput="leadQ=this.value;refocusSearch('leadsearch');render()" style="max-width:380px">${leadQ?` <button class="btn-o" style="padding:4px 10px" onclick="leadQ='';render()">Limpar</button>`:""}${canais.length?` <select onchange="leadCanalFiltro=this.value;render()" style="width:auto"><option value="">Todas as origens</option>${canais.map(function(c){return '<option '+(leadCanalFiltro===c?"selected":"")+'>'+esc(c)+'</option>';}).join("")}</select>${leadCanalFiltro?' <button class="btn-o" style="padding:4px 10px" onclick="leadCanalFiltro=\'\';render()">Ver todas as origens</button>':''}`:""}</div><div class="kanban">${cols}</div></div>`;}

 }).join("")||`<tr><td colspan="7" class="muted">Ainda sem leads do quiz.</td></tr>`;
 let catalogoHtml;

 else if(INSCR==="load"){catalogoHtml=`<div class="sec"><div class="muted">A carregar quiz/catálogo…</div></div>`;}
 else{
  const outrosTodos=INSCR.filter(function(r){return r.tipo!=="Pagamento";}).slice().sort(function(a,b){return (b.quando||"").localeCompare(a.quando||"");});

   </tbody></table></details>

 }

/* CHAMADAS */
let cSearch="";let chamadaAlvo=null;let chamFiltroColab="";let chamHistColab="";let mesTrafego="";
function normTel(t){return (t||"").replace(/\D/g,"");}
function chamadasDoLead(l){var nt=normTel(l.tel);return data.chamadas.filter(function(c){return nt?normTel(c.tel)===nt:(c.nome||"")===(l.nome||"");}).sort(function(a,b){return (b.data||"").localeCompare(a.data||"");});}
let carteiraGestora="";
function cartCard(l,i){const hist=chamadasDoLead(l);return `<div class="leadcard"><b>${esc(l.nome)}</b> ${esc(l.tel||"")} · ${esc(l.canal||"")}${l.fonte?' · <span class="pill p-azul" title="Fonte de tráfego">'+esc(l.fonte)+'</span>':''}<br>${esc(l.curso||"")}
  <div style="margin-top:4px"><span class="pill p-azul">Resp.: ${esc(l.resp||"—")}</span> <span class="pill ${l.estado==='Inscrito'?'p-verde':l.estado==='Contactado'?'p-dour':l.estado==='Perdido'?'p-verm':'p-cinza'}">${esc(l.estado||"")}</span></div>
  ${l.notas?'<div class="muted" style="margin-top:4px">📝 '+esc(l.notas)+'</div>':''}
  ${hist.length?'<div style="margin-top:6px;border-top:1px solid var(--linha);padding-top:4px"><div class="muted" style="font-weight:600">Histórico de chamadas ('+hist.length+')</div>'+hist.map(function(c){return '<div class="muted" style="margin-top:2px">'+esc(c.data||"")+(c.horaPedida?' · pediu contacto às '+esc(c.horaPedida):'')+' — <span style="color:var(--azul2)">'+esc(c.resultado||"")+'</span>'+(c.notas?': '+esc(c.notas):'')+'</div>';}).join("")+'</div>':'<div class="muted" style="margin-top:6px">Sem chamadas registadas ainda.</div>'}
  <div class="mv"><button class="btn-g" onclick="setChamada('${esc(l.nome)}','${esc(l.tel||'')}','Lead')">☎</button>${role==="admin"?`<button class="btn-o" onclick="reatribuir(${i})">Reatribuir</button>`:""}</div></div>`;}
function cartClienteCard(f){const hist=data.chamadas.filter(function(c){const nt=normTel(f.tel);return nt?normTel(c.tel)===nt:(c.nome||"")===(f.nome||"");}).sort(function(a,b){return (b.data||"").localeCompare(a.data||"");});const p=payOf(f.cod);const d=p?divida(p):0;
 return `<div class="leadcard"><b>${esc(f.nome)}</b> ${esc(f.tel||"")}<br>${esc(f.curso||"")}
  <div style="margin-top:4px"><span class="pill p-verde">Cliente</span> <span class="pill p-azul">Resp.: ${esc(f.vendedor||"—")}</span> ${d>0?'<span class="pill p-verm">Em dívida: '+kz(d)+'</span>':'<span class="pill p-cinza">Sem dívida</span>'}</div>
  ${hist.length?'<div style="margin-top:6px;border-top:1px solid var(--linha);padding-top:4px"><div class="muted" style="font-weight:600">Histórico de chamadas ('+hist.length+')</div>'+hist.map(function(c){return '<div class="muted" style="margin-top:2px">'+esc(c.data||"")+(c.horaPedida?' · pediu contacto às '+esc(c.horaPedida):'')+' — <span style="color:var(--azul2)">'+esc(c.resultado||"")+'</span>'+(c.notas?': '+esc(c.notas):'')+'</div>';}).join("")+'</div>':'<div class="muted" style="margin-top:6px">Sem chamadas registadas ainda.</div>'}
  <div class="mv"><button class="btn-g" onclick="setChamada('${esc(f.nome)}','${esc(f.tel||'')}','Formando')">☎</button><button class="btn-o" onclick="fFicha='${esc(f.cod)}';show('formandos')">Ficha</button></div></div>`;}
function atribuirCarteiraAuto(){let nLeads=0,nForm=0;
 data.leads.forEach(function(l){if((l.resp||"").trim())return;const hist=chamadasDoLead(l);const ult=hist.find(function(c){return (c.resp||"").trim();});if(ult){l.resp=ult.resp;nLeads++;}});
 data.formandos.forEach(function(f){if((f.vendedor||"").trim())return;const nt=normTel(f.tel);const hist=data.chamadas.filter(function(c){return nt?normTel(c.tel)===nt:(c.nome||"")===(f.nome||"");}).sort(function(a,b){return (b.data||"").localeCompare(a.data||"");});const ult=hist.find(function(c){return (c.resp||"").trim();});if(ult){f.vendedor=ult.resp;nForm++;}});
 persist();toast((nLeads+nForm)?("Atribuído: "+nLeads+" lead(s) e "+nForm+" formando(s), com base em quem atendeu"):"Nada por atribuir — já estava tudo com responsável, ou não há chamadas ligadas.");render();}
function vCarteira(){
 const opts=_perfisComCarteira();

  ${clientes.map(f=>cartClienteCard(f)).join("")||'<div class="muted">Sem clientes convertidos ainda.</div>'}</div>`;

function setChamada(nome,tel,tipo){chamadaAlvo={nome,tel,tipo};show("chamadas")}
function contatoOptions(){let o='<option value="">— da lista (opcional) —</option>';if(data.leads.length)o+='<optgroup label="Leads">'+data.leads.map((l,i)=>`<option value="L${i}">${esc(l.nome)} · ${esc(l.tel||"")}</option>`).join("")+'</optgroup>';if(data.formandos.length)o+='<optgroup label="Formandos">'+data.formandos.map((f,i)=>`<option value="F${i}">${esc(f.nome)} · ${esc(f.tel||"")}</option>`).join("")+'</optgroup>';return o;}
function segConcluir(i){var c=data.chamadas[i];if(!c)return;var m=prompt("O que ficou acordado nesta chamada de seguimento?");if(m===null)return;if(!(m||"").trim()){toast("Escreve o que ficou acordado");return;}c.segFeito=true;c.segAcordado=m.trim();c.segFeitoPor=(currentUser&&currentUser.nome)||role;c.segFeitoEm=new Date().toISOString().slice(0,10);persist();toast("Seguimento concluído");render();}
function _diaUtilAnterior(){var d=new Date();for(var i=0;i<10;i++){d.setDate(d.getDate()-1);var s=d.toISOString().slice(0,10);if(ehDiaUtil(s))return s;}return "";}
function alertaMetaOntem(){var me=(currentUser&&currentUser.nome)||"";if(!me)return null;var ont=_diaUtilAnterior();if(!ont)return null;var sm=statusMetaDia(me,ont);if(!sm.util||sm.cumpriuChamadas)return null;return {dia:ont,feitas:sm.feitas,meta:sm.meta};}
function alertasEquipaGestao(){if(role!=="admin")return [];var ont=_diaUtilAnterior();var out=[];colaboradoresComMeta().filter(temMetaPropria).forEach(function(n){var sm=statusMetaDia(n,ont);if(sm.util&&!sm.cumpriuChamadas)out.push({nome:n,tipo:"meta",txt:"não cumpriu a meta de "+ont+" ("+sm.feitas+"/"+sm.meta+")"});var d=desempenhoPorColaborador(n);if((d.chamadasMes||0)>0&&(d.vendas||0)===0)out.push({nome:n,tipo:"conversao",txt:"tem "+d.chamadasMes+" chamadas este mês e ainda 0 vendas — conversão fraca"});});
 (data.leads||[]).forEach(function(l){if(l.estado!=="Novo"&&l.estado!=="Contactado")return;var ref=l.ultimoMov||l.data;if(!ref)return;var dias=Math.floor((new Date(new Date().toDateString())-new Date(ref))/86400000);if(dias>leadParadoDias(l))out.push({nome:l.resp||"(sem responsável)",tipo:"lead-parado",txt:"lead "+esc(l.nome||"")+" ("+esc(l.canal||"")+") sem seguimento há "+dias+" dia(s)"});});
 return out;}
/* Áreas de responsabilidade — lista aberta (ex.: TikTok, Instagram, Cobranças) que a gestão cria e atribui a cada pessoa. */
function areasList(){if(!Array.isArray(data.areas))data.areas=[];return data.areas;}
function areasDe(nome){if(!nome)return[];var p=(data.perfis||[]).find(function(x){return x.nome===nome;});return (p&&Array.isArray(p.areas))?p.areas:[];}
function donosDeArea(area){return (data.perfis||[]).filter(function(p){return Array.isArray(p.areas)&&p.areas.indexOf(area)>=0;}).map(function(p){return p.nome;});}
function criarArea(){if(role!=="admin"){toast("Só a gestão");return;}var nome=(prompt("Nome da nova área (ex.: TikTok, Instagram, Cobranças):")||"").trim();if(!nome)return;var L=areasList();if(L.indexOf(nome)>=0){toast("Essa área já existe");return;}L.push(nome);persist();toast("Área criada");render();}

/* Duplicado = já existe um formando com o mesmo telefone (ou, sem telefone, o mesmo nome). Chamadas registadas não contam. */
function formandoDuplicado(tel,nome){var nt=normTel(tel);return (data.formandos||[]).find(function(f){if(nt)return normTel(f.tel)===nt;return nome&&(f.nome||"").trim().toLowerCase()===(nome||"").trim().toLowerCase();})||null;}
/* Edições ainda válidas para inscrever (nunca as já concluídas), do mesmo curso. */
function turmasAtivasPara(curso){var cl=(curso||"").trim().toLowerCase();return data.turmas.filter(function(t){if(estadoTurma(t)==="Concluída")return false;if(!cl)return true;return (t.curso||"").trim().toLowerCase()===cl;}).sort(function(a,b){return (+b.ed||0)-(+a.ed||0);});}
/* Tenta adivinhar a edição certa a partir do que já veio na ficha (edição do panfleto, ou a mais recente activa). */
function turmaAutoPara(r){if(r.turma){var t=turmaByCod(r.turma);if(t&&estadoTurma(t)!=="Concluída")return t.cod;}var ativas=turmasAtivasPara(r.curso);if(r.edicao){var porEd=ativas.find(function(t){return String(t.ed)===String(r.edicao);});if(porEd)return porEd.cod;}return ativas.length?ativas[0].cod:"";}

 if(turmaObj&&Array.isArray(turmaObj.turnos)&&turmaObj.turnos.length>1&&!val("conf_turno")){toast("Escolhe o turno antes de confirmar — não havia palpite fiável a partir do que veio da landing.");return;}
 const n=data.formandos.reduce((m,f)=>{const x=parseInt((f.cod||"").replace(/\D/g,""))||0;return x>m?x:m},0)+1;const cod="KA-"+String(n).padStart(3,"0");
 const horarioFinal=(turmaObj&&Array.isArray(turmaObj.turnos)&&turmaObj.turnos.length>1)?val("conf_turno"):(r.horario||"");
 data.formandos.push({cod,nome:r.nome||"",tel:r.tel||"",email:r.email||"",curso:cursoFinal,turma,periodo:r.periodo||"",horario:horarioFinal,modalidade:r.modalidade||"",canal:"Landing",fonte:r.fonte||"",data:new Date().toISOString().slice(0,10),criadoEm:new Date().toISOString(),criadoPor:(currentUser&&currentUser.nome)||role,estado:"Activo",vendedor:val("conf_resp")||"Gestão"});
 const total=precoDe(cursoFinal)||0;const pago=+r.valorPago||0;
 data.pagamentos.push({cod,plano:(pago>=total&&total>0)?"A pronto":"Prestações",total:total,pago:pago,comprovativo:r.comprovativo?"Sim":"Não",dataPrometida:"",prestacoes:pago>0?[{valor:pago,data:new Date().toISOString().slice(0,10),comprovativo:r.comprovativo?"Sim":"Não",comprovativoImg:r.comprovativo||""}]:[],criadoEm:new Date().toISOString()});
 persist();inscConfirmModal=null;confCursoSel=null;toast("Inscrito como formando"+(turma?" na turma":"")); fFicha=cod; show("formandos");}
function inscParaLead(i){const r=Array.isArray(INSCR)&&INSCR[i];if(!r)return;const hoje=new Date().toISOString().slice(0,10);data.leads.unshift({data:hoje,ultimoMov:hoje,nome:r.nome||"",tel:r.tel||"",canal:"Landing",curso:r.curso||"",estado:r.tipo==="Pagamento"?"Inscrito":"Novo",resp:"",fonte:r.fonte||"",criadoEm:r.quando||new Date().toISOString(),notas:"Inscrição pela landing"+(r.valorPago?" · pagou "+kz(r.valorPago):"")+(r.comprovativo?" · com comprovativo":"")});persist();toast("Convertido em lead");show("leads");}

function arquivados(){if(!Array.isArray(data.arquivados))data.arquivados=[];return data.arquivados;}
function estaArquivado(n){return arquivados().indexOf(n)>=0;}
function arquivarPessoa(nome){if(role!=="admin"){toast("Só a gestão");return;}if(!nome)return;if(!confirm("Arquivar "+nome+"? Deixa de aparecer nas listas do sistema (recuperável em RH → Arquivados)."))return;var a=arquivados();if(a.indexOf(nome)<0)a.push(nome);persist();toast(nome+" arquivado");render();}

function pessoasKA(){const s=new Set(Object.keys(data.salarios||{}));data.formandos.forEach(f=>{if(f.vendedor)s.add(f.vendedor)});data.turmas.forEach(t=>{if(t.resp)s.add(t.resp);if(t.assistente)s.add(t.assistente)});data.online.forEach(o=>{if(o.formador)s.add(o.formador)});return[...s].filter(Boolean).filter(n=>n!=="Gestão").filter(n=>!estaArquivado(n))}

function colabs(){if(!data.colaboradores)data.colaboradores=[];return data.colaboradores;}

function addColaborador(){const nome=val("cl_nome");if(!nome){toast("Falta o nome");return;}const L=colabs();const ex=L.find(c=>c.nome===nome);const rec={nome,categoria:val("cl_cat"),iban:val("cl_iban"),tel:val("cl_tel"),email:val("cl_email"),nasc:val("cl_nasc"),criadoEm:new Date().toISOString()};if(ex)Object.assign(ex,rec);else L.push(rec);const sal=+val("cl_sal")||0;if(sal)data.salarios[nome]=sal;const sub=+val("cl_subsidio")||0;if(sub){if(!data.subsidios)data.subsidios={};data.subsidios[nome]=sub;}persist();toast("Colaborador guardado");render();}

function promoverColaborador(i){if(role!=="admin"){toast("Só a gestão");return;}var L=colabs();var c=L[i];if(!c)return;if(!Array.isArray(data.promocoesNomes))data.promocoesNomes=[];var hint=data.promocoesNomes.length?" (já usadas: "+data.promocoesNomes.join(", ")+")":"";var nome=prompt("Nome da promoção"+hint+":","");if(nome===null)return;nome=nome.trim();if(nome&&data.promocoesNomes.indexOf(nome)<0)data.promocoesNomes.push(nome);var func=prompt("Nova função:",c.categoria||"");if(func===null)return;var sal=prompt("Novo salário mensal (Kz):",data.salarios[c.nome]||0);if(sal===null)return;var salN=+String(sal).replace(/\D/g,"")||0;if(!Array.isArray(c.promocoes))c.promocoes=[];c.promocoes.push({nome:nome,funcaoAntiga:c.categoria||"",funcaoNova:func.trim(),salarioAntigo:+(data.salarios[c.nome]||0),salarioNovo:salN,data:new Date().toISOString().slice(0,10)});c.categoria=func.trim();c.nivelPromocao=nome;data.salarios[c.nome]=salN;persist();toast(c.nome+" promovido"+(nome?" → "+nome:""));render();}
/* L40 — histórico de pagamentos de salário (data, hora, quem) + alerta ao colaborador (sistema + e-mail com o recibo) */

 var assunto="Recibo de salário — "+mes;var corpo="Olá "+nome+",\n\nO seu salário de "+mes+" foi processado em "+dataPag+".\n\nTotal recebido: "+kz(valor)+"\n\nQualquer dúvida, fala com a Gestão.\n\nKnowledge Angola";
 try{window.open("mailto:"+encodeURIComponent(c.email)+"?subject="+encodeURIComponent(assunto)+"&body="+encodeURIComponent(corpo),"_blank");}catch(e){}
 toast("Recibo de "+nome+" pronto a enviar por e-mail.");}

 persist();enviarAvisoSalarioPago(nome,mes,valor,dataPag);render();}

let pTurma="";let pData="";let pTurno="";let pQ="";let pSoFaltou=false;
function vPresencas(){

 const t=turmaByCod(pTurma);let corpo="";
 if(!pTurma){corpo='<div class="muted">Escolhe uma edição para ver as sessões.</div>';}
 else{const sess=sessoesDe(t);if(!pData&&sess.length){const _h=new Date().toISOString().slice(0,10);if(sess.indexOf(_h)>=0)pData=_h;else{let _b=sess[0],_bd=Infinity;sess.forEach(x=>{const _d=Math.abs(new Date(x)-new Date(_h));if(_d<_bd){_bd=_d;_b=x;}});pData=_b;}}
  if(!sess.length)corpo='<div class="note">Esta edição ainda não tem dias de aula (ou datas) definidos. Define os dias na aba Turmas &amp; Edições.</div>';
  else{const hoje=new Date().toISOString().slice(0,10);
   corpo='<div class="flex" style="gap:8px;flex-wrap:wrap;margin-bottom:12px">'+sess.map(s=>`<button class="btn-${pData===s?'p':'o'}" style="padding:5px 10px" onclick="pData='${s}';render()">${s}${s===hoje?' (hoje)':''}</button>`).join("")+'</div>';
   if(pData){let alunos=data.formandos.filter(f=>f.turma===pTurma);if(pTurno)alunos=alunos.filter(f=>(f.horario||f.turno||"")===pTurno);if(pQ){const _q=pQ.toLowerCase(),_qd=pQ.replace(/\D/g,"");alunos=alunos.filter(f=>(f.nome||"").toLowerCase().includes(_q)||(_qd&&(f.tel||"").replace(/\D/g,"").includes(_qd))||(f.email||"").toLowerCase().includes(_q));}
    if(pSoFaltou)alunos=alunos.filter(function(f){var pr=getPres(pTurma,pData,f.cod);return pr&&pr.estado&&pr.estado!=="Presente";});
    var turnosT=(t&&Array.isArray(t.turnos))?t.turnos.map(function(tn){return tn.horario;}).filter(Boolean):[];corpo+=`<div class="flex" style="gap:8px;margin-bottom:10px;flex-wrap:wrap"><label style="margin:0;font-weight:600">Turno:</label><select onchange="pTurno=this.value;render()" style="width:auto"><option value="">Todos os turnos</option>${turnosT.map(function(h){return '<option '+(pTurno===h?"selected":"")+'>'+esc(h)+'</option>';}).join("")}</select><input type="date" value="${esc(pData||"")}" onchange="pDataPick(this.value)" title="Ir para uma data de sessão (calendário)" style="width:auto"><input value="${esc(pQ)}" onchange="pQ=this.value;render()" placeholder="procurar nome, nº ou e-mail…" style="width:auto"><button class="btn-${pSoFaltou?'p':'o'}" style="padding:6px 10px" onclick="pSoFaltou=!pSoFaltou;render()">${pSoFaltou?'A mostrar só faltas ✓':'Só quem faltou'}</button></div>`;
    corpo+=`<table><thead><tr><th>Aluno</th><th>Turno</th><th>Avisou?</th><th>Presença</th><th>Comentário</th></tr></thead><tbody>${alunos.map(f=>{const pr=getPres(pTurma,pData,f.cod);const est=pr?pr.estado:"";const avc=comunicadosDe(f.tel).filter(c=>c.tipo==='Vai faltar');const avMsg=avc.length?(avc[0].msg||''):'';return `<tr><td>${esc(f.nome)} ${faltasDe(f.cod)>0?'<span class="pill p-verm" title="Total de faltas">'+faltasDe(f.cod)+' falta(s)</span>':''}${f.classroomAdd?' <span class="pill p-verde" title="Adicionado à Classroom">GC ✓</span>':(f.classroomInvite?' <span class="pill p-dour" title="Convite Classroom enviado">GC ✉</span>':'')}</td><td>${esc(f.turno||"—")}</td><td>${avc.length?'<span class="pill p-dour">avisou</span>'+(avMsg?'<div class="muted" style="margin-top:2px">'+esc(avMsg)+'</div>':''):'—'}</td><td><button type="button" id="btn_${esc(f.cod)}" class="pill ${est==='Presente'?'p-verde':'p-cinza'}" style="border:none;cursor:pointer;min-width:96px" onclick="togglePres('${esc(f.cod)}')">${est==='Presente'?'✓ Presente':'marcar'}</button><input type="hidden" id="pr_${esc(f.cod)}" value="${est==='Presente'?'Presente':''}">${est&&est!=='Presente'?'<div class="muted" style="margin-top:2px">'+esc(est)+'</div>':''}</td><td><input id="cm_${esc(f.cod)}" value="${esc(pr&&pr.comentario||"")}" placeholder="justificação (opcional)…" style="padding:5px 8px;width:auto"></td></tr>`}).join("")||`<tr><td colspan="5" class="muted">Sem alunos nesta edição.</td></tr>`}</tbody></table><div class="row-actions"><button class="btn-p" onclick="gravarPresencas()">Gravar presenças de ${pData}</button></div>`;

function togglePres(cod){var h=document.getElementById("pr_"+cod);var b=document.getElementById("btn_"+cod);if(!h)return;if(h.value==="Presente"){h.value="";if(b){b.className="pill p-cinza";b.textContent="marcar";}}else{h.value="Presente";if(b){b.className="pill p-verde";b.textContent="✓ Presente";}}}
function pDataPick(v){if(!v)return;var s=sessoesDe(turmaByCod(pTurma));if(s.indexOf(v)>=0){pData=v;render();}else{toast("Esse dia não é uma sessão desta turma");}}
function gravarPresencas(){if(!pTurma||!pData)return;var alunos=data.formandos.filter(function(f){return f.turma===pTurma;});if(pTurno)alunos=alunos.filter(function(f){return (f.horario||f.turno||"")===pTurno;});var n=0;alunos.forEach(function(f){var h=document.getElementById("pr_"+f.cod);if(!h)return;var presente=h.value==="Presente";var cmt=(document.getElementById("cm_"+f.cod)||{}).value||"";var avc=comunicadosDe(f.tel).filter(function(c){return c.tipo==="Vai faltar";});var avisou=avc.length>0;var est;if(presente){est="Presente";}else if(avisou){est="Justificada";if(!cmt.trim())cmt=avc[0].msg||"Avisou que ia faltar";}else if(cmt.trim()){est="Justificada";}else{est="Falta";}var ex=data.presencas.find(function(p){return p.turma===pTurma&&p.data===pData&&p.cod===f.cod;});if(ex){ex.estado=est;ex.comentario=cmt;}else data.presencas.push({turma:pTurma,data:pData,cod:f.cod,estado:est,comentario:cmt});n++;});persist();toast("Presenças gravadas ("+n+")");render();}

function syncFinancasOnline(){let n=0;(data.online||[]).forEach(function(o){ensureOnlineCod(o);syncPagOnline(o);n++;});persist();toast("Finanças sincronizadas — "+n+" aluno(s) online reconciliado(s)");render();}
/* Ordenação universal: clica no cabeçalho de qualquer tabela para ordenar A→Z / Z→A (datas e números incluídos). */
function _cellVal(td){var t=(td.innerText||"").trim();var d=t.match(/\d{4}-\d{2}-\d{2}/);if(d)return {n:new Date(d[0]).getTime(),s:""};var num=t.replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".");if(t&&/\d/.test(t)&&num&&!isNaN(parseFloat(num))&&t.length<20)return {n:parseFloat(num),s:""};return {n:null,s:t.toLowerCase()};}
function ordenarTabela(th){try{var table=th.closest("table");if(!table)return;var idx=Array.prototype.indexOf.call(th.parentNode.children,th);var tb=table.tBodies[0];if(!tb)return;var asc=th.getAttribute("data-ord")!=="asc";Array.prototype.forEach.call(th.parentNode.children,function(x){x.removeAttribute("data-ord");var s=x.querySelector(".ordi");if(s)s.remove();});th.setAttribute("data-ord",asc?"asc":"desc");var mark=document.createElement("span");mark.className="ordi";mark.style.cssText="font-size:10px;margin-left:4px;opacity:.7";mark.textContent=asc?"▲":"▼";th.appendChild(mark);
 var rows=Array.prototype.slice.call(tb.rows).filter(function(r){return r.cells.length>idx;});
 rows.sort(function(a,b){var A=_cellVal(a.cells[idx]),B=_cellVal(b.cells[idx]);var r;if(A.n!==null&&B.n!==null)r=A.n-B.n;else r=A.s.localeCompare(B.s,"pt");return asc?r:-r;});
 rows.forEach(function(r){tb.appendChild(r);});}catch(e){}}
function _initOrdenar(){try{document.querySelectorAll("#views table th").forEach(function(th){if(th.dataset._ord)return;th.dataset._ord="1";th.style.cursor="pointer";th.title="Clica para ordenar";th.addEventListener("click",function(){ordenarTabela(th);});});}catch(e){}}
function exportarVista(fmt){try{if(fmt==="pdf"&&current==="comprovativo"){if(typeof printComp==="function")printComp();else toast("Escolhe primeiro um aluno no Comprovativo");return;}
 var tbs=document.querySelectorAll("#views table");if(!tbs.length){toast("Nada para exportar nesta página");return;}
 if(fmt==="pdf"){var ht=document.documentElement;ht.classList.add("pv");var t0=document.title;document.title=(PAGES[current]?PAGES[current][0]:"Lista")+" — Knowledge Angola";window.print();setTimeout(function(){ht.classList.remove("pv");document.title=t0;},900);return;}
 var out="";tbs.forEach(function(t,ti){if(ti)out+="\n\n";Array.prototype.forEach.call(t.rows,function(r){var cs=[];Array.prototype.forEach.call(r.cells,function(c){var v=(c.innerText||"").replace(/\s+/g," ").trim().replace(/"/g,'""');cs.push('"'+v+'"');});out+=cs.join(";")+"\n";});});
 var bl=new Blob(["﻿"+out],{type:"text/csv;charset=utf-8;"});var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=(PAGES[current]?PAGES[current][0]:"lista")+"-"+new Date().toISOString().slice(0,10)+".csv";a.click();toast("Exportado — abre no Excel");}catch(e){toast("Não deu para exportar");}}

function exportCSV(tipo){const rows=data[tipo];if(!rows.length){toast("Nada para exportar");return}const keys=Object.keys(rows[0]);
 const csv=[keys.join(",")].concat(rows.map(r=>keys.map(k=>`"${String(r[k]==null?"":r[k]).replace(/"/g,'""')}"`).join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=tipo+"-KA.csv";a.click();toast("Exportado "+tipo);}
function importCSV(){const txt=val("imp").trim();if(!txt){toast("Cola os dados primeiro");return}const tipo=val("imptipo");const lines=txt.split(/\r?\n/);const keys=lines[0].split(",").map(s=>s.trim().replace(/^"|"$/g,""));
 const out=lines.slice(1).filter(l=>l.trim()).map(l=>{const cells=parseLine(l);const o={};keys.forEach((k,i)=>o[k]=(cells[i]||"").trim());return o});if(!out.length){toast("Sem linhas");return}
 data[tipo]=out;persist();toast("Importado "+out.length+" registos");show(tipo);}
function parseLine(l){const r=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){r.push(c);c=""}else c+=ch}r.push(c);return r}
function baixarBackup(){try{const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="backup-KA-"+new Date().toISOString().slice(0,10)+".json";a.click();toast("Cópia de segurança descarregada");}catch(e){toast("Erro ao gerar cópia");}}
function exportXLSX(){if(typeof XLSX==="undefined"){toast("Biblioteca Excel ainda a carregar — tenta daqui a instantes");return;}const wb=XLSX.utils.book_new();["formandos","turmas","pagamentos","leads","chamadas","certificados","online","comunicados"].forEach(function(tipo){const rows=data[tipo]||[];if(!rows.length)return;const ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,tipo.slice(0,31));});
 var F=data.financas||{};
 if((F.gastos||[]).length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(F.gastos),"financas_gastos");
 if((F.entregas||[]).length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(F.entregas),"financas_entregas");
 var pnl=data.turmas.map(function(t){var cods=data.formandos.filter(function(f){return f.turma===t.cod;}).map(function(f){return f.cod;});var fact=data.pagamentos.filter(function(p){return cods.indexOf(p.cod)>=0;}).reduce(function(a,p){return a+(+p.pago||0);},0);var cst=(F.gastos||[]).filter(function(g){return g.centroCusto===t.cod;}).reduce(function(a,g){return a+(+g.valor||0);},0);return {Edicao:t.ed+"a",Curso:t.curso,Facturado:fact,Custo:cst,Margem:fact-cst};});
 if(pnl.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pnl),"PL_por_turma");
 if(!wb.SheetNames.length){toast("Nada para exportar");return;}XLSX.writeFile(wb,"Knowledge-Angola-dados.xlsx");toast("Excel exportado");}
function importXLSX(inp){const f=inp.files&&inp.files[0];if(!f)return;if(typeof XLSX==="undefined"){toast("Biblioteca Excel ainda a carregar");return;}const tipo=val("imptipo");const r=new FileReader();r.onload=function(e){try{const wb=XLSX.read(e.target.result,{type:"array"});let sheet=wb.SheetNames.indexOf(tipo)>=0?tipo:wb.SheetNames[0];const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{defval:""}).map(function(o){const n={};Object.keys(o).forEach(function(k){n[String(k).trim()]=o[k];});return n;});if(!rows.length){toast("Folha '"+sheet+"' vazia");return;}if(!confirm("Importar "+rows.length+" linhas da folha '"+sheet+"' para "+tipo+"? Substitui a lista actual."))return;data[tipo]=rows;persist();toast("Importado "+rows.length+" de Excel");show(tipo);}catch(err){toast("Erro a ler o Excel");}};r.readAsArrayBuffer(f);inp.value="";}

let _crop={idx:-1,src:"",natW:0,natH:0,zoom:1,x:50,y:50};
function onPerfilFoto(i,inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){_crop={idx:i,src:e.target.result,natW:img.width,natH:img.height,zoom:1,x:50,y:50};render();};img.src=e.target.result;};r.readAsDataURL(f);}
function _cropCalc(box){var sc=Math.max(box/_crop.natW,box/_crop.natH)*(_crop.zoom||1);var dw=_crop.natW*sc,dh=_crop.natH*sc;var dx=-(dw-box)*(_crop.x/100),dy=-(dh-box)*(_crop.y/100);return {dw:dw,dh:dh,dx:dx,dy:dy};}
function cropPreview(){var el=document.getElementById("cropprev");if(!el)return;var c=_cropCalc(240);el.style.backgroundImage="url("+_crop.src+")";el.style.backgroundRepeat="no-repeat";el.style.backgroundSize=c.dw+"px "+c.dh+"px";el.style.backgroundPosition=c.dx+"px "+c.dy+"px";}

function salvarCrop(){var p=data.perfis[_crop.idx];if(!p){fecharCrop();return;}var box=240;var cv=document.createElement("canvas");cv.width=box;cv.height=box;var img=new Image();img.onload=function(){var c=_cropCalc(box);var ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,box,box);ctx.drawImage(img,c.dx,c.dy,c.dw,c.dh);p.foto=cv.toDataURL("image/jpeg",0.85);persist();_crop.idx=-1;toast("Foto guardada");render();};img.src=_crop.src;}

  <div class="muted" style="font-size:12px">Zoom</div><input type="range" min="1" max="3" step="0.02" value="${_crop.zoom}" oninput="setCrop('zoom',this.value)" style="width:100%">

function fundirHistorico(nomeOrigem,nomeDestino){
 if(!nomeOrigem||!nomeDestino||nomeOrigem===nomeDestino)return;
 (data.formandos||[]).forEach(function(f){if(f.vendedor===nomeOrigem)f.vendedor=nomeDestino;if(f.formador===nomeOrigem)f.formador=nomeDestino;if(f.gestora===nomeOrigem)f.gestora=nomeDestino;if(f.criadoPor===nomeOrigem)f.criadoPor=nomeDestino;});
 (data.turmas||[]).forEach(function(t){if(t.resp===nomeOrigem)t.resp=nomeDestino;if(t.assistente===nomeOrigem)t.assistente=nomeDestino;if(t.gestora===nomeOrigem)t.gestora=nomeDestino;if(Array.isArray(t.turnos))t.turnos.forEach(function(tn){if(tn.gestora===nomeOrigem)tn.gestora=nomeDestino;if(tn.formador===nomeOrigem)tn.formador=nomeDestino;});});
 (data.online||[]).forEach(function(o){if(o.formador===nomeOrigem)o.formador=nomeDestino;if(o.criadoPor===nomeOrigem)o.criadoPor=nomeDestino;});
 (data.chamadas||[]).forEach(function(c){if(c.resp===nomeOrigem)c.resp=nomeDestino;});
 (data.leads||[]).forEach(function(l){if(l.resp===nomeOrigem)l.resp=nomeDestino;});
 if(data.salarios&&data.salarios[nomeOrigem]!=null){if(!data.salarios[nomeDestino])data.salarios[nomeDestino]=data.salarios[nomeOrigem];delete data.salarios[nomeOrigem];}
 if(data.salariosPagos){Object.keys(data.salariosPagos).forEach(function(m){var P=data.salariosPagos[m];if(P&&P[nomeOrigem]){if(!P[nomeDestino])P[nomeDestino]=P[nomeOrigem];delete P[nomeOrigem];}});}
 if(Array.isArray(data.colaboradores)){var co=data.colaboradores.find(function(c){return c.nome===nomeOrigem;});var cd=data.colaboradores.find(function(c){return c.nome===nomeDestino;});if(co){if(cd){["categoria","iban","tel","nasc"].forEach(function(k){if(!cd[k]&&co[k])cd[k]=co[k];});}data.colaboradores=data.colaboradores.filter(function(c){return c.nome!==nomeOrigem;});}}
}
function confirmarFundir(){
 if(role!=="admin"){toast("Só a gestão");return;}
 const iOrig=fundirOrigem;if(iOrig===null)return;
 const p=data.perfis[iOrig];if(!p)return;
 const iDest=+val("fundir_destino");const d=data.perfis[iDest];
 if(!d||iDest===iOrig){toast("Escolhe um perfil de destino diferente");return;}
 if(!confirm('Fundir "'+p.nome+'" em "'+d.nome+'"? O histórico passa todo para "'+d.nome+'" e "'+p.nome+'" é apagado. Não se pode desfazer.'))return;
 fundirHistorico(p.nome,d.nome);
 data.perfis.splice(iOrig,1);
 persist();fundirOrigem=null;syncAutorizados();toast("Perfis fundidos");render();
}
function resetPerfilPass(i){const p=data.perfis[i];if(!p)return;const np=prompt("Novo PIN para "+p.nome+" (deixa vazio para só entrar por e-mail Google):",p.pass||"");if(np===null)return;p.pass=np;p.permitePin=!!np;persist();toast(np?"PIN definido — pode entrar por PIN":"Sem PIN — entra só por e-mail");render()}
function changePass(){const p=val("np");if(!p){toast("Escreve a nova senha");return}data.pass=p;persist();toast("Senha actualizada")}
function resetAll(){var c=prompt("Isto apaga TUDO e repõe os exemplos. Escreve o código de segurança para confirmar:");if(c===null)return;if((c||"").trim()!=="199612"){toast("Código de segurança errado — reposição cancelada");return;}data=seed();persist();toast("Dados repostos");render();}
</script>
